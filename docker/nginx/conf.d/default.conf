resolver 127.0.0.11 valid=30s; # Docker's internal DNS resolver

server {
	listen 443 ssl;
	listen 5000;
	server_name twdh.local;

	ssl_certificate /etc/nginx/ssl/fullchain.pem;
	ssl_certificate_key /etc/nginx/ssl/twdh-server.key;

	location / {

		proxy_pass http://ckan:5000; #  Decrypt TLS here and pass as plain HTTP
        
		# Ensure CKAN knows the original request was over HTTPS
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		#proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Proto https;


	}
}
